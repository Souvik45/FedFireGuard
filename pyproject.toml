[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedfireguard"
version = "0.1.0"
description = "Privacy-Preserving Federated Learning with Reinforcement-Driven Alerting for Real-Time Wildfire Risk Detection Across Distributed IoT Sensor Networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Research Team" }
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torch-geometric>=2.3.0",
    "flwr>=1.7.0",
    "opacus>=1.4.0",
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",
    "shap>=0.43.0",
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "hydra-core>=1.3.2",
    "pydantic>=2.4.0",
    "tqdm>=4.66.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "flake8>=6.1.0",
    "black>=23.9.0",
    "mypy>=1.6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "configs*", "scripts*", "outputs*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
